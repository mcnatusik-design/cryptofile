apiVersion: apps/v1
kind: Deployment
metadata:
  name: cryptofile
  namespace: cryptofile
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cryptofile
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: cryptofile
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: macally/cryptofile:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: cryptofile-config
            - secretRef:
                name: cryptofile-secret
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
